<mat-card>
  <mat-card-content>
    <form #forgetPasswordForm="ngForm" (ngSubmit)="onSubmit()">
      <h2>Mot de passe oublié.</h2>
      <h3>Veuillez renseigner votre email pour réinitialiser votre mot de passe.</h3>
      @if (!forgetPasswordError()) {
        <mat-error>
          L'email est requis.
        </mat-error>
      }
      <mat-form-field>
        <input matInput placeholder="Email" [(ngModel)]="userName" name="userName" required>
        <mat-error>
          Veuillez renseigner un email valide.
        </mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" [disabled]="!forgetPasswordForm.form.valid">Valider</button>
    </form>
  </mat-card-content>
</mat-card>
