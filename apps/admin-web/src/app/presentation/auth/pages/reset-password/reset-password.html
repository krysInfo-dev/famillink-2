<mat-card>
  <mat-card-content>
    <form #resetPasswordForm="ngForm" (ngSubmit)="onSubmit()">
      <h2>{{userName()}} choix de votre mot de passe</h2>
      @if (!resetPasswordError()) {
        <mat-error>
          Le mot de passe est invalide.
        </mat-error>
      }
      <mat-form-field>
        <input matInput type="password" placeholder="Entrez votre nouveau mot de passe" [(ngModel)]="password" name="password" required minlength="12"
               pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!?@*$\-+]).{12,}$">
        <mat-error>
          Veuillez renseigner un mot de passe valide.
        </mat-error>
      </mat-form-field>
      <mat-form-field>
        <input matInput type="password" placeholder="Confirmer votre nouveau mot de passe" [(ngModel)]="confirmPassword" name="confirmPassword" required [appPasswordMatch]="password()">
        <mat-error>
          Les mot de passe ne sont pas identiques.
        </mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" [disabled]="!resetPasswordForm.form.valid">Valider</button>
    </form>
  </mat-card-content>
</mat-card>
